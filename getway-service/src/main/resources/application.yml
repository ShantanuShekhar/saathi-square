server:
  port: 1010

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
        - id: rbac-service
          uri: lb://RBAC-SERVICE
          predicates:
            - Path=/rbac/**
        - id: society-service
          uri: lb://SOCIETY-SERVICE
          predicates:
            - Path=/society/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
